<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the page paint into the notch and the home-indicator
       area; every edge that matters then pays the inset back with env() in
       src/site.css (gutters, footer, drawer, lightbox rail). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Not Found · Draw Clever</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A0908" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <!-- Self-contained: a 404 may be served at any path depth, so it must not
       depend on relatively-resolved external CSS. Asset URLs and links are
       root-relative, which works on any domain Vercel serves this from. -->
  <style>
    @font-face { font-family: 'Playfair Display SC'; src: url('/Fonts/Playfair_Display_SC/PlayfairDisplaySC-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Playfair Display SC'; src: url('/Fonts/Playfair_Display_SC/PlayfairDisplaySC-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: 'Playfair Display'; src: url('/Fonts/Playfair_Display/PlayfairDisplay.woff2') format('woff2-variations'), url('/Fonts/Playfair_Display/PlayfairDisplay.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Playfair Display'; src: url('/Fonts/Playfair_Display/PlayfairDisplay-Italic.woff2') format('woff2-variations'), url('/Fonts/Playfair_Display/PlayfairDisplay-Italic.woff2') format('woff2'); font-weight: 100 900; font-style: italic; font-display: swap; }
    @font-face { font-family: 'Inter'; src: url('/Fonts/Inter/Inter.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
    /* Metric-matched fallback. Playfair Display SC is ~21% wider and much
       taller than Times, so the swap re-laid out the hero and moved it 110px
       up. These overrides make the fallback occupy the real font's box, so the
       swap becomes a repaint instead of a re-layout. Measured with canvas
       TextMetrics against Times New Roman 400; see README. */
    @font-face { font-family: 'Playfair SC Fallback'; src: local('Times New Roman'), local('Times'); size-adjust: 120.68%; ascent-override: 89.49%; descent-override: 20.72%; line-gap-override: 0%; }
    @font-face { font-family: 'Playfair SC Fallback'; src: local('Times New Roman Italic'), local('Times Italic'), local('Times New Roman'); font-style: italic; size-adjust: 138.12%; ascent-override: 78.19%; descent-override: 18.10%; line-gap-override: 0%; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* This page is standalone — it never loads site.css, so it carries its own
       copy of the tokens it uses. --muted was #6E675C (3.6:1 on ink, below AA);
       it now matches the shared ramp. Type roles mirror src/site.css. */
    :root { --ink:#0A0908; --text:#F3EEE6; --sub:#B3ABA0; --muted:#999181; --line:#211F1B; --line-2:#2C2925; --champ:#EAD9B0; --ease:cubic-bezier(.16,1,.3,1);
      --t-body: clamp(16px, 7.77px + 0.571vw, 22.4px);
      --t-ui:   clamp(13px, 6.31px + 0.464vw, 18.2px);
      --dur-press: .12s; --dur-ui: .28s;
      --grad-gold: linear-gradient(102deg,#EAD9B0 0%,#D9BD82 26%,#C8A96A 50%,#B5853F 76%,#9C6B2E 100%); }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: vt-out .34s cubic-bezier(.16,1,.3,1) both; }
    ::view-transition-new(root) { animation: vt-in .5s cubic-bezier(.16,1,.3,1) both; }
    @keyframes vt-out { to { opacity: 0; } }
    @keyframes vt-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; } }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    /* overflow was `hidden`, which assumed the content always fits. On a phone in
       landscape it does not: a 219px numeral plus the mark, heading, paragraph,
       button and links overran a 390px screen, and `hidden` then clipped the way
       out of the page with no way to scroll to it. Only the x axis is locked now,
       and the box centres by min-height rather than by clipping. */
    body { background: var(--ink); color: var(--text); font-family: 'Inter', sans-serif; font-weight: 400; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: max(40px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(40px, env(safe-area-inset-left, 0px)); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    /* ACCESSIBILITY: the page content now sits in a main element so a screen
       reader has a landmark to jump to. It inherits the centring body used to do
       itself, so the rendered box is unchanged. */
    main { width: 100%; flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .mark { height: 46px; margin-bottom: 56px; mix-blend-mode: screen; opacity: .9; }
    .code { font-family: 'Playfair Display SC', 'Playfair SC Fallback', serif; font-size: clamp(110px, 26vw, 320px); line-height: .82; letter-spacing: -.01em; color: var(--champ); }
    h1 { font-family: 'Playfair Display SC', 'Playfair SC Fallback', serif; font-weight: 400; text-transform: none; font-size: clamp(24px, 3.2vw, 38px); letter-spacing: .012em; margin: 28px 0 16px; }
    h1 .i { font-style: italic; color: var(--champ); }
    p { font-size: var(--t-body); color: var(--sub); line-height: 1.8; max-width: 44ch; margin-bottom: 40px; }
    .btn { font-size: var(--t-ui); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; padding: 15px 34px; min-height: 44px; border-radius: 100px; background: var(--grad-gold); color: #15110A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform var(--dur-ui) var(--ease), box-shadow var(--dur-ui); }
    /* Hover is a pointer capability — see the note in src/site.css. Left ungated,
       a tap on a touch screen left this button lifted and glowing for good. */
    @media (hover: hover) and (pointer: fine) { .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(200,169,106,.28); } }
    .btn:active { transform: translateY(0) scale(.985); transition-duration: var(--dur-press); }
    .btn:focus-visible, .links a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 100px; }
    .links { margin-top: 30px; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
    .links a { font-size: var(--t-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; transition: color var(--dur-ui); }
    @media (hover: hover) and (pointer: fine) { .links a:hover { color: #C8A96A; } }
    .links a:active { color: #C8A96A; }
    /* A phone in landscape: 844px wide clears every width breakpoint, so a 390px
       screen was handed a 219px numeral and everything below it fell off. */
    @media (max-height: 560px) and (orientation: landscape) {
      .mark { height: 32px; margin-bottom: 20px; }
      .code { font-size: clamp(64px, 13vw, 120px); }
      h1 { margin: 12px 0 8px; }
      p { margin-bottom: 20px; line-height: 1.6; }
      .links { margin-top: 14px; }
    }
    #dc-loader { position: fixed; inset: 0; z-index: 9500; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .7s var(--ease), visibility .7s; }
    html.dc-loading { overflow: hidden; }
    html.dc-loading #dc-loader { opacity: 1; visibility: visible; pointer-events: auto; }
    #dc-loader .dc-mark { height: 50px; width: auto; mix-blend-mode: screen; opacity: .9; animation: dcPulse 2.1s ease-in-out infinite; }
    #dc-loader .dc-bar { position: relative; width: 122px; height: 1px; background: var(--line-2); overflow: hidden; }
    #dc-loader .dc-bar::after { content: ''; position: absolute; inset: 0; background: var(--grad-gold); transform: translateX(-100%); animation: dcBar 1.5s var(--ease) infinite; }
    @keyframes dcPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @keyframes dcBar { to { transform: translateX(100%); } }
    html.dc-ready .code, html.dc-ready h1, html.dc-ready p, html.dc-ready .btn, html.dc-ready .links { animation: dcHeadIn .9s var(--ease) both; }
    html.dc-ready h1 { animation-delay: .12s; } html.dc-ready p { animation-delay: .22s; } html.dc-ready .btn { animation-delay: .32s; } html.dc-ready .links { animation-delay: .42s; }
    @keyframes dcHeadIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  </style>
  <script>(function(){var h=document.documentElement,first=true;try{first=!sessionStorage.getItem("dcv");sessionStorage.setItem("dcv","1");}catch(e){}if(!first){h.classList.add('dc-ready');return;}h.classList.add('dc-loading');var MIN=450,MAX=4500,t0=Date.now(),done=false;function go(){if(done)return;done=true;setTimeout(function(){h.classList.remove('dc-loading');h.classList.add('dc-ready');},Math.max(0,MIN-(Date.now()-t0)));}var ff=document.fonts;(ff&&ff.ready?ff.ready:Promise.resolve()).then(go);setTimeout(go,MAX);})();</script>
</head>
<body>
  <div id="dc-loader" aria-hidden="true"><img class="dc-mark" src="/Logo Variants/logo-mark-384.png" alt="Draw Clever" width="384" height="252" /><span class="dc-bar"></span></div>
  <img class="mark" src="/Logo Variants/logo-mark-384.png" alt="Draw Clever" width="384" height="252" />
  <div class="code">404</div>
  <h1>This space hasn't<br />been <span class="i">built</span> yet.</h1>
  <p>The page you're looking for has moved, or never existed. Let's return you to something beautifully designed.</p>
  <a href="/" class="btn">Back to Home</a>
  <div class="links">
    <a href="/projects">Portfolio</a>
    <a href="/about-us">About</a>
    <a href="/services">Services</a>
    <a href="/contact">Contact</a>
  </div>
</body>
</html>
